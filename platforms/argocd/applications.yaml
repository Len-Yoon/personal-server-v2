apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: book-dev
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  description: V2 개발 Book 실습 전용
  sourceRepos:
    - ssh://git@github.com/Len-Yoon/personal-server-v2.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: v2-dev
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: apps
      kind: Deployment
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: book-verify
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  description: V2 검증 Book 실습 전용
  sourceRepos:
    - ssh://git@github.com/Len-Yoon/personal-server-v2.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: v2-verify
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: apps
      kind: Deployment
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-dev
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: book-dev
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: apps/book/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-dev
  # 최초 수동 동기화로 장애 주입 중 자동 복구와의 충돌을 방지함.
  syncPolicy:
    syncOptions:
      - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-verify
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: book-verify
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: apps/book/overlays/verify
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-verify
  syncPolicy:
    syncOptions:
      - FailOnSharedResource=true
