apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: argocd-platform
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  description: V2 로컬 Argo CD 자체 관리 전용. CRD와 RBAC 변경을 포함함
  sourceRepos:
    - ssh://git@github.com/Len-Yoon/personal-server-v2.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: networking.k8s.io
      kind: NetworkPolicy
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: argocd-platform
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: platforms/argocd/chart
    helm:
      releaseName: argocd
      valueFiles:
        - ../values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Argo CD CRD의 큰 스키마는 server-side apply로 반영함.
  # prune/자동 동기화와 cascade finalizer는 설정하지 않음.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - FailOnSharedResource=true
