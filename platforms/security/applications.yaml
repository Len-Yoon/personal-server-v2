apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  description: V2 앱 namespace 한정 정책·진단 권한·기본 네트워크 거부 관리
  sourceRepos:
  - ssh://git@github.com/Len-Yoon/personal-server-v2.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: v2-dev
  - server: https://kubernetes.default.svc
    namespace: v2-verify
  clusterResourceWhitelist:
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicy
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicyBinding
  namespaceResourceWhitelist:
  - group: ''
    kind: ServiceAccount
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  - group: networking.k8s.io
    kind: NetworkPolicy
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: security
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: security
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: platforms/security/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-dev
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
