apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: logging
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: platforms/observability/tracing/tempo
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-observability
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
