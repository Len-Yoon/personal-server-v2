apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-isolation
  namespace: v2-observability
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: alloy
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 4317
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: grafana
          lab.personal-server-v2/owner: personal-server-v2
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 3200
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
