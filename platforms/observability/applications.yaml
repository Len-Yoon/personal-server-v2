apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  description: V2 지표·대시보드·HTTP 가용성 관측 전용
  sourceRepos:
    - ssh://git@github.com/Len-Yoon/personal-server-v2.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: v2-observability
  clusterResourceWhitelist:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: apps
      kind: Deployment
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: observability
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: platforms/observability/prometheus/chart
    helm:
      releaseName: prometheus
      valueFiles: [../values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-observability
  syncPolicy:
    syncOptions:
      - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: observability
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: platforms/observability/grafana/chart
    helm:
      releaseName: grafana
      valueFiles: [../values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-observability
  syncPolicy:
    syncOptions:
      - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: observability
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: platforms/observability/blackbox
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-observability
  syncPolicy:
    syncOptions:
      - FailOnSharedResource=true
