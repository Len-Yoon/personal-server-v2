apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: logging
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  description: V2 소유 Pod 로그 수집 및 단일 Loki 저장소 전용
  sourceRepos:
  - ssh://git@github.com/Len-Yoon/personal-server-v2.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: v2-dev
  - server: https://kubernetes.default.svc
    namespace: v2-verify
  - server: https://kubernetes.default.svc
    namespace: argocd
  - server: https://kubernetes.default.svc
    namespace: v2-observability
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: Service
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: StatefulSet
  - group: apps
    kind: Deployment
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  - group: networking.k8s.io
    kind: NetworkPolicy
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: logging
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: platforms/observability/logging/loki
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-observability
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: logging
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: platforms/observability/logging/alloy
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-observability
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
