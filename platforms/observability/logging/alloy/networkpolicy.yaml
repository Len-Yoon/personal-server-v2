apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-isolation
  namespace: v2-observability
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 12345
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
          - v2-dev
          - v2-verify
      podSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - book
          - portal
          - youtube
        matchLabels:
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 4318
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: loki
    ports:
    - protocol: TCP
      port: 3100
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: tempo
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 4317
