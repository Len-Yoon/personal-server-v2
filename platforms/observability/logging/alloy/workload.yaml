apiVersion: v1
kind: ServiceAccount
metadata:
  name: v2-alloy
  namespace: v2-observability
  labels:
    lab.personal-server-v2/owner: personal-server-v2
automountServiceAccountToken: true
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: v2-observability
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alloy
  ports:
  - name: http
    port: 12345
    targetPort: http
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: v2-observability
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        lab.personal-server-v2/owner: personal-server-v2
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: k3d-ps-v2-agent-1
      terminationGracePeriodSeconds: 30
      containers:
      - name: alloy
        image: grafana/alloy:v1.21.0@sha256:9726bfba078de9bc2212c60c6e643238c700b4fe0868ea78cbe03163d03d95bf
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy/data
        - --server.http.listen-addr=0.0.0.0:12345
        - --server.http.enable-pprof=false
        - --server.http.disable-support-bundle=true
        - --disable-reporting
        ports:
        - name: http
          containerPort: 12345
        - name: otlp-http
          containerPort: 4318
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
          readOnly: true
        - name: storage
          mountPath: /var/lib/alloy/data
        - name: tmp
          mountPath: /tmp
        env:
        - name: GOMEMLIMIT
          value: 192MiB
      volumes:
      - name: config
        configMap:
          name: alloy-config
      - name: storage
        emptyDir:
          sizeLimit: 128Mi
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      serviceAccountName: v2-alloy
  strategy:
    type: Recreate
