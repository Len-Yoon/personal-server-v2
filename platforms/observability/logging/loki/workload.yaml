apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: v2-observability
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: v2-observability
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
  - name: http
    port: 3100
    targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: v2-observability
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        lab.personal-server-v2/owner: personal-server-v2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: k3d-ps-v2-agent-1
      terminationGracePeriodSeconds: 30
      containers:
      - name: loki
        image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
        args:
        - -config.file=/etc/loki/config.yaml
        ports:
        - name: http
          containerPort: 3100
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        volumeMounts:
        - name: config
          mountPath: /etc/loki
          readOnly: true
        - name: storage
          mountPath: /loki
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: storage
        persistentVolumeClaim:
          claimName: loki-data
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
  serviceName: loki
