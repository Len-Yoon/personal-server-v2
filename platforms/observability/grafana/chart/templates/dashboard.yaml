apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-v2-lab-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    lab.personal-server-v2/owner: personal-server-v2
data:
  v2-platform-lab.json: |
    {{- .Files.Get "files/v2-platform-lab.json" | nindent 4 }}
  v2-logs.json: |
    {{- .Files.Get "files/v2-logs.json" | nindent 4 }}
  v2-traces.json: |
    {{- .Files.Get "files/v2-traces.json" | nindent 4 }}
  v2-notes-api.json: |
    {{- .Files.Get "files/v2-notes-api.json" | nindent 4 }}
