grafana:
  fullnameOverride: grafana
  extraLabels:
    lab.personal-server-v2/owner: personal-server-v2
  podLabels:
    lab.personal-server-v2/owner: personal-server-v2
  automountServiceAccountToken: false
  replicas: 1
  deploymentStrategy:
    type: Recreate
  nodeSelector:
    kubernetes.io/hostname: k3d-ps-v2-agent-1
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
    port: 80
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: local-path
    lookupVolumeName: false
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    extraPvcLabels:
      lab.personal-server-v2/owner: personal-server-v2
  initChownData:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 768Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
  env:
    GOMEMLIMIT: 512MiB
  testFramework:
    enabled: false
  grafana.ini:
    server:
      domain: localhost
      root_url: http://localhost:8083
    analytics:
      check_for_updates: false
      reporting_enabled: false
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
    log:
      mode: console
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        uid: v2-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.v2-observability.svc.cluster.local
        isDefault: true
        editable: false
      - name: Loki
        uid: v2-loki
        type: loki
        access: proxy
        url: http://loki.v2-observability.svc.cluster.local:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 300
          derivedFields:
          - name: TraceID
            matcherRegex: trace_id=([0-9a-f]{32})
            datasourceUid: v2-tempo
            url: $${__value.raw}
            urlDisplayLabel: Tempo에서 trace 조회
      - name: Tempo
        uid: v2-tempo
        type: tempo
        access: proxy
        url: http://tempo.v2-observability.svc.cluster.local:3200
        isDefault: false
        editable: false
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: v2-loki
            spanStartTimeShift: -1m
            spanEndTimeShift: 1m
            tags:
            - key: service.name
              value: service
            - key: deployment.environment.name
              value: environment
            filterByTraceID: true
            filterBySpanID: false
          streamingEnabled:
            search: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: v2-lab
        orgId: 1
        folder: V2 Lab
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards/v2-lab
  dashboardsConfigMaps:
    v2-lab: grafana-v2-lab-dashboard
  rbac:
    create: false
