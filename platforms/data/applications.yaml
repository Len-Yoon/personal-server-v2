apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: data-policy
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: argocd
spec:
  sourceRepos:
  - ssh://git@github.com/Len-Yoon/personal-server-v2.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: v2-data-dev
  clusterResourceWhitelist:
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicy
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicyBinding
  namespaceResourceWhitelist: []
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-policy
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: argocd
spec:
  project: data-policy
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: platforms/data/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-data-dev
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
