  name: notes-db
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notes-backup
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-dev
automountServiceAccountToken: false
---
