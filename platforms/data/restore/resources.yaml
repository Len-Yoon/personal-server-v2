apiVersion: v1
kind: ServiceAccount
metadata:
  name: notes-api
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notes-db
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notes-backup
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-backups
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-restore
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
spec:
  selector:
    lab.personal-server-v2/owner: personal-server-v2
    app.kubernetes.io/name: notes-db
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
spec:
  serviceName: postgres-restore
  replicas: 1
  selector:
    matchLabels:
      lab.personal-server-v2/owner: personal-server-v2
      app.kubernetes.io/name: notes-db
  template:
    metadata:
      labels:
        lab.personal-server-v2/owner: personal-server-v2
        app.kubernetes.io/name: notes-db
    spec:
      serviceAccountName: notes-db
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k3d-ps-v2-agent-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: localhost:5001/v2-data-postgres@sha256:0ec426da1ac6743acc9577094574534ab69e3f43380446208f272976a338630d
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 384Mi
        args:
        - postgres
        - -c
        - listen_addresses=*
        - -c
        - password_encryption=scram-sha-256
        env:
        - name: POSTGRES_DB
          value: notes_restore
        - name: POSTGRES_PASSWORD_FILE
          value: /bootstrap/admin
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          readOnly: false
        - name: tmp
          mountPath: /var/run/postgresql
          readOnly: false
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: temp
          mountPath: /tmp
          readOnly: false
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - notes_restore
          initialDelaySeconds: 3
          periodSeconds: 3
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - notes_restore
          initialDelaySeconds: 30
          periodSeconds: 10
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
            - -d
            - notes_restore
          failureThreshold: 60
          periodSeconds: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: tmp
        emptyDir: {}
      - name: bootstrap
        secret:
          secretName: notes-db-bootstrap
          defaultMode: 288
      - name: temp
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
spec:
  replicas: 0
  selector:
    matchLabels:
      lab.personal-server-v2/owner: personal-server-v2
      app.kubernetes.io/name: notes-api
  template:
    metadata:
      labels:
        lab.personal-server-v2/owner: personal-server-v2
        app.kubernetes.io/name: notes-api
    spec:
      serviceAccountName: notes-api
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k3d-ps-v2-agent-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: localhost:5001/v2-notes-api@sha256:a01d91a65aa0708c7c0874539b440a08565917b5839d609d62e4a86acf473db6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 384Mi
        env:
        - name: PGHOST
          value: postgres-restore
        - name: PGDATABASE
          value: notes_restore
        - name: PGUSER
          value: notes_app
        - name: PGPASSWORD_FILE
          value: /auth/password
        - name: NOTES_API_TOKEN_FILE
          value: /auth/token
        volumeMounts:
        - name: auth
          mountPath: /auth
          readOnly: true
        - name: tmp
          mountPath: /tmp
          readOnly: false
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: auth
        secret:
          secretName: notes-api-auth
          defaultMode: 288
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
spec:
  selector:
    lab.personal-server-v2/owner: personal-server-v2
    app.kubernetes.io/name: notes-api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-transfer
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
spec:
  replicas: 1
  selector:
    matchLabels:
      lab.personal-server-v2/owner: personal-server-v2
      app.kubernetes.io/name: notes-transfer
  template:
    metadata:
      labels:
        lab.personal-server-v2/owner: personal-server-v2
        app.kubernetes.io/name: notes-transfer
    spec:
      serviceAccountName: notes-backup
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k3d-ps-v2-agent-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: transfer
        image: localhost:5001/v2-data-postgres@sha256:0ec426da1ac6743acc9577094574534ab69e3f43380446208f272976a338630d
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 384Mi
        command:
        - python3
        - -c
        - import os,time,stat; p='/backups/archives'; os.makedirs(p,mode=0o700,exist_ok=True);
          s=os.lstat(p); assert stat.S_ISDIR(s.st_mode) and s.st_uid==os.getuid()
          and stat.S_IMODE(s.st_mode) in (0o700,0o2700,0o2770) and s.st_gid==999;
          os.chmod(p,0o700); time.sleep(2147483647)
        volumeMounts:
        - name: backups
          mountPath: /backups
          readOnly: false
        - name: tmp
          mountPath: /tmp
          readOnly: false
      volumes:
      - name: backups
        persistentVolumeClaim:
          claimName: notes-backups
      - name: tmp
        emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-default-deny
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-db
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notes-db
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: notes-api
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: notes-backup
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: notes-restore
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-clients
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
spec:
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: In
      values:
      - notes-api
      - notes-backup
      - notes-restore
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: v2-observability
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: notes-db
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data-budget
  labels:
    lab.personal-server-v2/owner: personal-server-v2
  namespace: v2-data-restore
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 1536Mi
    limits.cpu: '4'
    limits.memory: 3Gi
    requests.storage: 2Gi
    persistentvolumeclaims: '2'
    pods: '10'
