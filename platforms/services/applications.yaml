apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: portal-dev
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  description: V2 dev portal 전용
  sourceRepos:
  - ssh://git@github.com/Len-Yoon/personal-server-v2.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: v2-dev
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: Service
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: Deployment
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: ''
    kind: ServiceAccount
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portal-dev
  namespace: argocd
  labels:
    lab.personal-server-v2/owner: personal-server-v2
spec:
  project: portal-dev
  source:
    repoURL: ssh://git@github.com/Len-Yoon/personal-server-v2.git
    targetRevision: main
    path: apps/portal/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: v2-dev
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
---
