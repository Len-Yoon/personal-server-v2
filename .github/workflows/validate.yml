name: V2 정적 검증
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 검증 의존성
        run: |
          python3 -m pip install PyYAML==6.0.3
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.35.5/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.35.5/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: 안전 경계 및 배포 계약
        run: python3 -m unittest discover -s tests -v
      - name: Argo CD chart checksum 및 렌더링
        run: |
          curl -fsSLo /tmp/argocd.tgz https://github.com/argoproj/argo-helm/releases/download/argo-cd-10.10.5/argo-cd-10.10.5.tgz
          echo 'ba6447eeed42bc41d1f0527721047b236304e97669a7b6286d02be4a1644ba7a  /tmp/argocd.tgz' | sha256sum --check
          helm template argocd /tmp/argocd.tgz -n argocd -f platforms/argocd/values.yaml > /tmp/argocd.yaml
      # 클러스터 생성·배포·자격 증명 접근은 이 workflow의 범위가 아님.
