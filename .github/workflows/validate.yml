name: V2 정적 검증
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 검증 의존성
        run: |
          python3 -m pip install PyYAML==6.0.3 fastapi==0.142.2 uvicorn==0.34.0 httpx==0.28.1 -r tools/telemetry/requirements.txt
          python3 -c 'import fastapi, httpx, uvicorn, opentelemetry.sdk.trace'
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.35.5/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.35.5/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
      - name: 안전 경계 및 배포 계약
        run: python3 -m unittest discover -s tests -v
      - name: Bootstrap 및 self chart 렌더링
        run: |
          helm template argocd platforms/argocd/chart -n argocd -f platforms/argocd/values.yaml > /tmp/argocd-self.yaml
          helm template argocd platforms/argocd/chart -n argocd -f platforms/argocd/values.yaml --set argo-cd.configs.secret.createSecret=true --set argo-cd.redisSecretInit.enabled=true > /tmp/argocd-bootstrap.yaml
      - name: Loki·Alloy·Tempo 고정 바이너리 설정 검증
        run: python3 tools/validate_logging.py --ci
      # 클러스터 생성·배포·자격 증명 접근은 이 workflow의 범위가 아님.
