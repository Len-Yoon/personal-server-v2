apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: youtube
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - k3d-ps-v2-agent-0
      containers:
      - name: youtube
        image: localhost:5001/v2-youtube:pending
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8002
        envFrom:
        - secretRef:
            name: youtube-auth
        env:
        - name: APP_ENV
          value: development
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PORTAL_HOME_URL
          value: http://127.0.0.1:8000
        - name: V2_COOKIE_PREFIX
          value: v2_dev_
        - name: YOUTUBE_MEMO_DB_PATH
          value: /data/youtube_memo.sqlite3
        - name: OTEL_SERVICE_NAME
          value: youtube
        - name: OTEL_TRACES_EXPORTER
          value: none
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://alloy.v2-observability.svc.cluster.local:4318
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: youtube-data
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
