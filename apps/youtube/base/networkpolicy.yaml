apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: youtube-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: youtube
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: portal
    ports:
    - protocol: TCP
      port: 8002
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: v2-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: blackbox
    ports:
    - protocol: TCP
      port: 8002
