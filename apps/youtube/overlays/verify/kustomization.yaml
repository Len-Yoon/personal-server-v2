apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: v2-verify
resources:
- ../../base
labels:
- pairs:
    lab.personal-server-v2/environment: verify
  includeSelectors: false
  includeTemplates: true
images:
- name: localhost:5001/v2-youtube
  newName: localhost:5001/v2-youtube
  digest: sha256:2be7c51cb6337089344de97470fd064a62f1a8998c7e05953d362e5903fddf87
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: youtube
    spec:
      template:
        spec:
          containers:
          - name: youtube
            env:
            - name: PORTAL_HOME_URL
              value: http://127.0.0.1:8090
            - name: V2_COOKIE_PREFIX
              value: v2_verify_
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: youtube
    spec:
      template:
        spec:
          containers:
          - name: youtube
            env:
            - name: V2_ENVIRONMENT
              value: verify
