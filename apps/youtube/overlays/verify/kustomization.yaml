apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: v2-verify
resources:
- ../../base
labels:
- pairs:
    lab.personal-server-v2/environment: verify
  includeSelectors: false
  includeTemplates: true
images:
- name: localhost:5001/v2-youtube
  newName: localhost:5001/v2-youtube
  digest: sha256:111bb22e8c02b1bdd551014d849db48ba38a7f9744cd6dd1e6c7f0b043d7d73f
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: youtube
    spec:
      template:
        spec:
          containers:
          - name: youtube
            env:
            - name: PORTAL_HOME_URL
              value: http://127.0.0.1:8090
            - name: V2_COOKIE_PREFIX
              value: v2_verify_
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: youtube
    spec:
      template:
        spec:
          containers:
          - name: youtube
            env:
            - name: V2_ENVIRONMENT
              value: verify
