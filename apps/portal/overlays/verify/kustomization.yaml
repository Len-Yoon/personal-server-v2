apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: v2-verify
resources:
- ../../base
labels:
- pairs:
    lab.personal-server-v2/environment: verify
  includeSelectors: false
  includeTemplates: true
images:
- name: localhost:5001/v2-portal
  newName: localhost:5001/v2-portal
  digest: sha256:615da84f73d1b9f02f7583ea705a7a2da63d121f97c183b0f533321739eb41ea
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: portal
    spec:
      template:
        spec:
          containers:
          - name: portal
            env:
            - name: PORTAL_HOME_URL
              value: http://127.0.0.1:8090
            - name: V2_COOKIE_PREFIX
              value: v2_verify_
            - name: YOUTUBE_MEMO_URL
              value: http://127.0.0.1:8092
            - name: BOOK_MEMO_URL
              value: http://127.0.0.1:8081
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: portal
    spec:
      template:
        spec:
          containers:
          - name: portal
            env:
            - name: V2_ENVIRONMENT
              value: verify
