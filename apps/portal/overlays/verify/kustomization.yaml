apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: v2-verify
resources:
- ../../base
labels:
- pairs:
    lab.personal-server-v2/environment: verify
  includeSelectors: false
  includeTemplates: true
images:
- name: localhost:5001/v2-portal
  newName: localhost:5001/v2-portal
  digest: sha256:c5f3b0614ce97b36b273eca652a52d4425ccb0514bf7ba96ec7628606834f79e
patches:
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: portal
    spec:
      template:
        spec:
          containers:
          - name: portal
            env:
            - name: PORTAL_HOME_URL
              value: http://127.0.0.1:8090
            - name: V2_COOKIE_PREFIX
              value: v2_verify_
            - name: YOUTUBE_MEMO_URL
              value: http://127.0.0.1:8092
            - name: BOOK_MEMO_URL
              value: http://127.0.0.1:8081
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: portal
    spec:
      template:
        spec:
          containers:
          - name: portal
            env:
            - name: V2_ENVIRONMENT
              value: verify
