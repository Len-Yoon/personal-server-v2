apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portal
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: v2-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: blackbox
          lab.personal-server-v2/owner: personal-server-v2
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: v2-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: v2-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: alloy
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 4318
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: book
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 8003
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: youtube
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 8002
