apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: book-data
  annotations:
    # Application prune로 실습 기록을 삭제하지 않음. 전체 클러스터 정리 시 소실됨.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
