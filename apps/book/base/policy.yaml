apiVersion: v1
kind: ResourceQuota
metadata:
  name: book-budget
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    requests.storage: 4Gi
    persistentvolumeclaims: "4"
    pods: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: book-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 384Mi
      max:
        cpu: "1"
        memory: 1Gi
