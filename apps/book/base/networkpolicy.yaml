apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: book-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: book
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: portal
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 8003
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: v2-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: blackbox
          lab.personal-server-v2/owner: personal-server-v2
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: v2-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 8003
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: v2-observability
      podSelector:
        matchLabels:
          app.kubernetes.io/name: alloy
          lab.personal-server-v2/owner: personal-server-v2
    ports:
    - protocol: TCP
      port: 4318
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 0.0.0.0/8
        - 10.0.0.0/8
        - 100.64.0.0/10
        - 127.0.0.0/8
        - 169.254.0.0/16
        - 172.16.0.0/12
        - 192.0.0.0/24
        - 192.0.2.0/24
        - 192.88.99.0/24
        - 192.168.0.0/16
        - 198.18.0.0/15
        - 198.51.100.0/24
        - 203.0.113.0/24
        - 224.0.0.0/4
        - 240.0.0.0/4
    ports:
    - protocol: TCP
      port: 443
