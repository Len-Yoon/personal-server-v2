apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: v2-verify
resources:
- ../../base
labels:
- pairs:
    lab.personal-server-v2/environment: verify
  includeSelectors: false
  includeTemplates: true
images:
- name: v2-book
  newName: localhost:5001/v2-book
  digest: sha256:ba9c6fa455f86398bf1758588b3ca969b7afd4910285f3c1bc857854d9a12bf5
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: book
    spec:
      template:
        spec:
          containers:
            - name: book
              env:
                - name: PORTAL_HOME_URL
                  value: http://127.0.0.1:8090
                - name: V2_COOKIE_PREFIX
                  value: v2_verify_
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: book
    spec:
      template:
        spec:
          containers:
          - name: book
            env:
            - name: V2_ENVIRONMENT
              value: verify
