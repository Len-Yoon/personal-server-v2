apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: v2-verify
resources:
- ../../base
labels:
- pairs:
    lab.personal-server-v2/environment: verify
  includeSelectors: false
  includeTemplates: true
images:
- name: v2-book
  newName: localhost:5001/v2-book
  digest: sha256:8d140c6f517482a35c81f95678125989b8b341cdc3467b9ace09a50a802fc75c
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: book
    spec:
      template:
        spec:
          containers:
            - name: book
              env:
                - name: PORTAL_HOME_URL
                  value: http://127.0.0.1:8090
                - name: V2_COOKIE_PREFIX
                  value: v2_verify_
- patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: book
    spec:
      template:
        spec:
          containers:
          - name: book
            env:
            - name: V2_ENVIRONMENT
              value: verify
