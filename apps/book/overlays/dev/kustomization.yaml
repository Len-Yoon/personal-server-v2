apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: v2-dev
resources:
  - ../../base
labels:
  - pairs:
      lab.personal-server-v2/environment: dev
    includeSelectors: false
    includeTemplates: true
images:
  - name: v2-book
    newName: localhost:5001/v2-book
    digest: sha256:28b2b290d51b634e0e2777b9b325f3e44709055e61bbd1573f0052fb91e1c2ce
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: book
      spec:
        template:
          spec:
            containers:
              - name: book
                env:
                  - name: PORTAL_HOME_URL
                    value: http://127.0.0.1:8000
                  - name: V2_COOKIE_PREFIX
                    value: v2_dev_
